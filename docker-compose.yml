name: football

services:
  agent:
    build: ./apps/agent
    image: football-agent
    ports:
      - "8088:8088"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./apps/web
    image: football-web
    ports:
      - "3000:3000"
    environment:
      AGENT_URL: http://agent:8088
    depends_on:
      agent:
        condition: service_healthy
